# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.34.0'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: fibey-agent
metadata:
    template: fibey-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: gpt-5.4-mini
              model:
                format: OpenAI
                name: gpt-5.4-mini
                version: '2026-03-17'
              sku:
                name: GlobalStandard
                capacity: 100
    fibey-agent:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            path: ./Dockerfile.agent
            remoteBuild: true
        uses:
            - ai-project
        kind: hosted
        name: fibey-agent
        description: Fiber field operations assistant using inventory, work orders, knowledge retrieval and service status through a Foundry toolbox.
        protocols:
            - protocol: responses
              version: 2.0.0
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLBOX_NAME: ${TOOLBOX_NAME}
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        startupCommand: python -m fibey.agent.hosted
    gateway:
        project: .
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            remoteBuild: true
    inventory-mcp:
        project: services/inventory-mcp
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            remoteBuild: true
    status-dashboard:
        project: services/status-dashboard
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            remoteBuild: true
    ui:
        project: ui
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            remoteBuild: true
    work-orders-api:
        project: services/work-orders-api
        host: containerapp
        language: docker
        docker:
            path: ./Dockerfile
            remoteBuild: true
infra:
    layers:
        - provider: bicep
          path: infra
          module: main
          name: infra
          dependsOn:
            - foundry
        - name: foundry
          path: infra/foundry
          provider: microsoft.foundry
